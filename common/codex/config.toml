model = "gpt-5.5-terra"
model_reasoning_effort = "medium"
model_verbosity = "low"
personality = "pragmatic"

approval_policy = "on-request"
approvals_reviewer = "auto_review"

[features]
multi_agent = true

[agents]
max_threads = 8

[mcp_servers.context7]
command = "npx"
args = ["-y", "@upstash/context7-mcp"]
